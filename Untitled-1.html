<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Love You</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #000000;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        perspective: 800px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #star-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }

      /* Đã bỏ transition để không xung đột với requestAnimationFrame */
      #scene {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        z-index: 2;
        will-change: transform;
      }

      .floating-item {
        position: absolute;
        left: 50%;
        top: 50%;
        white-space: nowrap;
        pointer-events: none;
        will-change: transform;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      /* Tối ưu hiệu ứng Neon nhẹ cho GPU */
      .neon-pink {
        color: #ffffff;
        font-weight: 600;
        text-shadow:
          0 0 6px #fff,
          0 0 14px #ff007f,
          0 0 24px #ff007f;
      }

      .neon-blue {
        color: #ffffff;
        font-weight: 600;
        text-shadow:
          0 0 6px #fff,
          0 0 14px #00d4ff,
          0 0 24px #00d4ff;
      }

      .neon-heart {
        color: #ff2a2a;
        text-shadow:
          0 0 8px #ff2a2a,
          0 0 16px #ff5500;
      }
    </style>
  </head>
  <body>
    <canvas id="star-canvas"></canvas>
    <div id="scene"></div>

    <audio id="bg-music" loop>
      <source src="nhac-nen.mp3" type="audio/mpeg" />
    </audio>

    <script>
      const messages = [
        "Chúc em yêu 20/10 vui vẻ",
        "28/01/2008",
        "trong lòng có anh",
        "chúc em mãi xinh đẹp",
        "chúc em những điều tốt đẹp nhất",
        "anh yêu em nhiều lắm",
        "Cảm ơn em vì tất cả",
      ];

      // 1. Vẽ bầu trời sao tĩnh trên Canvas (rất nhẹ)
      const canvas = document.getElementById("star-canvas");
      const ctx = canvas.getContext("2d");

      function drawStars() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 150; i++) {
          ctx.beginPath();
          ctx.arc(
            Math.random() * canvas.width,
            Math.random() * canvas.height,
            Math.random() * 1.3,
            0,
            Math.PI * 2,
          );
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.random()})`;
          ctx.fill();
        }
      }
      window.addEventListener("resize", drawStars);
      drawStars();

      // 2. Tạo chữ và trái tim với số lượng vừa đủ để giữ 60fps
      const scene = document.getElementById("scene");
      const items = [];
      const textElements = [];
      const TOTAL_TEXTS = 55;
      const TOTAL_HEARTS = 35;
      const SPREAD_XY = 1400;
      const SPREAD_Z = 1500;

      function createItem(isHeart = false) {
        const el = document.createElement("div");
        if (isHeart) {
          el.className = "floating-item neon-heart";
          el.innerText = "❤";
          el.style.fontSize = Math.random() * 20 + 18 + "px";
        } else {
          el.className = "floating-item neon-pink";
          el.innerText = messages[Math.floor(Math.random() * messages.length)];
          el.style.fontSize = Math.random() * 14 + 16 + "px";
          textElements.push(el);
        }

        scene.appendChild(el);

        items.push({
          el: el,
          x: (Math.random() - 0.5) * SPREAD_XY,
          y: (Math.random() - 0.5) * SPREAD_XY,
          z: (Math.random() - 0.5) * SPREAD_Z,
          speedY: Math.random() * 1.2 + 0.6,
        });
      }

      for (let i = 0; i < TOTAL_TEXTS; i++) createItem(false);
      for (let i = 0; i < TOTAL_HEARTS; i++) createItem(true);

      // Đổi màu hồng <-> xanh mỗi 5 giây mà không bắt GPU render lại mỗi khung hình
      let isPink = true;
      setInterval(() => {
        isPink = !isPink;
        const newClass = isPink
          ? "floating-item neon-pink"
          : "floating-item neon-blue";
        for (let i = 0; i < textElements.length; i++) {
          textElements[i].className = newClass;
        }
      }, 5000);

      // 3. Xử lý vuốt xoay mượt với độ trễ quán tính (Lerp)
      let targetRotX = -10,
        targetRotY = -18;
      let currentRotX = -10,
        currentRotY = -18;
      let isDragging = false;
      let prevX = 0,
        prevY = 0;

      function startDrag(x, y) {
        isDragging = true;
        prevX = x;
        prevY = y;
        const audio = document.getElementById("bg-music");
        if (audio && audio.paused) {
          audio.play().catch(() => {});
        }
      }

      function moveDrag(x, y) {
        if (!isDragging) return;
        const dx = x - prevX;
        const dy = y - prevY;
        targetRotY += dx * 0.25;
        targetRotX -= dy * 0.25;
        prevX = x;
        prevY = y;
      }

      function endDrag() {
        isDragging = false;
      }

      window.addEventListener("mousedown", (e) =>
        startDrag(e.clientX, e.clientY),
      );
      window.addEventListener(
        "mousemove",
        (e) => moveDrag(e.clientX, e.clientY),
        { passive: true },
      );
      window.addEventListener("mouseup", endDrag);

      window.addEventListener(
        "touchstart",
        (e) => startDrag(e.touches[0].clientX, e.touches[0].clientY),
        { passive: true },
      );
      window.addEventListener(
        "touchmove",
        (e) => moveDrag(e.touches[0].clientX, e.touches[0].clientY),
        { passive: true },
      );
      window.addEventListener("touchend", endDrag);

      // 4. Vòng lặp Animation 60 FPS
      const halfSpread = SPREAD_XY / 2;
      function animate() {
        // Nội suy góc xoay giúp chuyển động cực mượt khi vuốt
        currentRotX += (targetRotX - currentRotX) * 0.15;
        currentRotY += (targetRotY - currentRotY) * 0.15;

        scene.style.transform = `rotateX(${currentRotX.toFixed(2)}deg) rotateY(${currentRotY.toFixed(2)}deg)`;

        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          item.y += item.speedY;

          if (item.y > halfSpread) {
            item.y = -halfSpread;
          }

          item.el.style.transform = `translate3d(${item.x | 0}px, ${item.y | 0}px, ${item.z | 0}px)`;
        }

        requestAnimationFrame(animate);
      }

      animate();
    </script>
  </body>
</html>
